<rect width="480" height="920" rx="12" fill="#f8fafc"/>
<g font-family="system-ui, sans-serif" fill="#111827">
<text x="24" y="38" font-size="25" font-weight="700">One possible trace</text>
<rect x="16" y="64" width="448" height="132" rx="10" fill="#eff6ff" stroke="#526071" stroke-width="2"/>
<text x="32" y="96" font-size="22" font-weight="700">T0 · Editor interactive</text>
