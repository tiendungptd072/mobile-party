<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 920" role="img" aria-labelledby="title description">
<title id="title">One possible trace</title>
<desc id="description">T0 · Editor interactive; Editor mounted; Preview running; Process alive. T1 · Attachments cover editor; Editor retained; Preview stopped; Process alive. T2 · Return to editor; Same retained owner; Reconcile preview needs; Process alive. T3 · Go Home; Component may remain; Preview stopped; Process survival not promised. T4 · Process ends; In-memory owners lost; No guaranteed final callback.</desc>
