<text x="32" y="428" font-size="22" font-weight="700">T2 · Return to editor</text>
<text x="32" y="458" font-size="21">Same retained owner</text>
<text x="32" y="488" font-size="21">Reconcile preview needs</text>
<text x="32" y="518" font-size="21">Process alive</text>
<path d="M240 528V562" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
