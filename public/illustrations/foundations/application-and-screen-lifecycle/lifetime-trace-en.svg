<text x="32" y="292" font-size="21">Editor retained</text>
<text x="32" y="322" font-size="21">Preview stopped</text>
<text x="32" y="352" font-size="21">Process alive</text>
<path d="M240 362V396" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
