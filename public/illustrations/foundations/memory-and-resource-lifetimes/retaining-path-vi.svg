<svg xmlns="http://www.w3.org/2000/svg" width="480" height="920" viewBox="0 0 480 920" role="img" aria-labelledby="title desc"><title id="title">Một retaining path</title><desc id="desc">Service giữ callback, editor E1 và preview buffer. Unsubscribe cắt path này; release native handle là việc riêng.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs><rect width="480" height="920" rx="16" fill="#f8fafc"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#0f172a"><text x="240" y="38" font-size="24" font-weight="700">Một retaining path</text><rect x="16" y="64" width="448" height="112" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="240" y="104" font-size="22" font-weight="700">Event service sống lâu</text><text x="240" y="138" font-size="20" font-weight="400">Registration đang hoạt động</text><rect x="16" y="248" width="448" height="112" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="240" y="288" font-size="22" font-weight="700">Callback / closure</text><text x="240" y="322" font-size="20" font-weight="400">Capture mạnh E1</text><rect x="16" y="432" width="448" height="112" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="240" y="472" font-size="22" font-weight="700">Owner trình soạn E1</text><text x="240" y="506" font-size="20" font-weight="400">Sở hữu dữ liệu preview</text><rect x="16" y="616" width="448" height="112" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="240" y="656" font-size="22" font-weight="700">Preview buffer</text><text x="240" y="690" font-size="20" font-weight="400">Vẫn reachable qua path này</text><text x="240" y="214" font-size="20" fill="#b91c1c">Cắt registration này: unsubscribe</text><text x="240" y="814" font-size="20">Retaining path khác vẫn có thể còn</text><text x="240" y="848" font-size="20">Native handle cần release riêng</text></g><g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"><path d="M240 176V188M240 226V248"/><path d="M240 360V432"/><path d="M240 544V616"/></g></svg>
