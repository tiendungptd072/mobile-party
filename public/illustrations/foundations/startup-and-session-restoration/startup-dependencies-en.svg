<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1000" role="img" aria-labelledby="title description">
<title id="title">Startup dependencies</title>
<desc id="description">Minimal startup + safe shell. Local defaults / coordinator. No protected report yet. Storage. Open / migrate. Ready or error. Preserve data. Session. Resolve account. Access outcome. Or unavailable. Join prerequisites. Usable storage + account policy. Then read A / D42. Choose an allowed UI. Editor, sign-in, or recovery. A read error is not empty data. Optional reconciliation. Accept only current results. On error: show recovery UI.</desc>
