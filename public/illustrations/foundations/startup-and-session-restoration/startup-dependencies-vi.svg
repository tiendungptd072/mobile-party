<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1000" role="img" aria-labelledby="title description">
<title id="title">Dependency khởi động</title>
<desc id="description">Startup tối thiểu + UI chờ. Mặc định cục bộ / coordinator. Chưa lộ báo cáo cần bảo vệ. Storage. Mở / migrate. Sẵn sàng hoặc lỗi. Giữ dữ liệu. Session. Xác định account. Kết quả truy cập. Hoặc chưa khả dụng. Hợp nhất prerequisite. Storage dùng được + chính sách. Sau đó đọc A / D42. Chọn UI được phép. Editor, đăng nhập, khôi phục. Lỗi đọc không phải dữ liệu rỗng. Reconciliation tùy chọn. Chỉ nhận kết quả còn phù hợp. Khi lỗi: chọn UI khôi phục.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker></defs>
