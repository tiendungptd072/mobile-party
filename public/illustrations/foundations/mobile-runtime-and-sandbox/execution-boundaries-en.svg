<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 816" role="img" aria-labelledby="title description">
  <title id="title">Execution and access</title>
  <desc id="description">One app process: UI and application code, Language runtime(s), Native libraries / plugins, UI / worker execution paths. App files: Stored data is not live memory. Service request: OS access check, Protected system service. Another app: Separate memory and private files, No direct access shown.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker></defs>
  <rect width="480" height="816" rx="12" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" fill="#111827">
    <text x="24" y="38" font-size="25" font-weight="700">Execution and access</text>
    <rect x="16" y="60" width="448" height="268" rx="10" fill="#fff" stroke="#526071" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="32" y="96" font-size="23" font-weight="700">One app process</text>
    <text x="32" y="142" font-size="22">UI and application code</text>
    <text x="32" y="190" font-size="22">Language runtime(s)</text>
    <text x="32" y="238" font-size="22">Native libraries / plugins</text>
    <text x="32" y="290" font-size="21">UI / worker execution paths</text>
    <path d="M208 328V374" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="16" y="374" width="424" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="32" y="410" font-size="23" font-weight="700">App files</text>
    <text x="32" y="448" font-size="21">Stored data is not live memory</text>
    <path d="M464 280H472V568H440" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="260" y="502" font-size="20">Service request</text>
    <rect x="16" y="522" width="424" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="32" y="560" font-size="23" font-weight="700">OS access check</text>
    <text x="32" y="597" font-size="21">Protected system service</text>
    <rect x="16" y="660" width="448" height="132" rx="10" fill="#fff" stroke="#526071" stroke-width="2"/>
    <text x="32" y="696" font-size="23" font-weight="700">Another app</text>
    <text x="32" y="736" font-size="21">Separate memory and private files</text>
    <text x="32" y="774" font-size="21">No direct access shown</text>
  </g>
</svg>
