<svg xmlns="http://www.w3.org/2000/svg" width="480" height="920" viewBox="0 0 480 920" role="img" aria-labelledby="title desc"><title id="title">Đường input và ownership</title><desc id="desc">Nhận diện pointer và editing theo focus cung cấp input cho owner. Tap có thể yêu cầu focus; cancellation không submit.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#475569"/></marker></defs><rect width="480" height="920" rx="16" fill="#f8fafc"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#0f172a"><text x="240" y="38" font-size="24" font-weight="700">Đường input và ownership</text><rect x="16" y="64" width="216" height="108" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="124" y="94" font-size="21" font-weight="700">Pointer</text><text x="124" y="124" font-size="19" font-weight="400">Down / move / up</text><text x="124" y="154" font-size="19" font-weight="400">hoặc cancellation</text><rect x="248" y="64" width="216" height="108" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="356" y="94" font-size="21" font-weight="700">Keyboard / IME</text><text x="356" y="124" font-size="19" font-weight="400">Nhập text</text><text x="356" y="154" font-size="19" font-weight="400">hoặc replacement</text><rect x="16" y="232" width="216" height="108" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="124" y="262" font-size="21" font-weight="700">Hit test</text><text x="124" y="292" font-size="19" font-weight="400">Target phù hợp</text><rect x="248" y="232" width="216" height="108" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="356" y="262" font-size="21" font-weight="700">Target có focus</text><text x="356" y="292" font-size="19" font-weight="400">Định tuyến phím</text><rect x="16" y="400" width="216" height="144" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="124" y="430" font-size="21" font-weight="700">Gesture</text><text x="124" y="460" font-size="19" font-weight="400">Nhận diện action</text><text x="124" y="490" font-size="19" font-weight="400">hoặc hủy</text><rect x="248" y="400" width="216" height="144" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="356" y="430" font-size="21" font-weight="700">Editing value</text><text x="356" y="460" font-size="19" font-weight="400">Text + selection</text><text x="356" y="490" font-size="19" font-weight="400">Composition</text><rect x="16" y="632" width="448" height="128" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="240" y="662" font-size="21" font-weight="700">Owner trình soạn</text><text x="240" y="692" font-size="19" font-weight="400">Nhận edit hoặc command hợp lệ</text><text x="240" y="722" font-size="19" font-weight="400">Save là thao tác riêng</text><text x="240" y="812" font-size="20">Nét đứt: tap có thể yêu cầu focus</text><text x="240" y="844" font-size="20">Cancellation không submit</text><text x="240" y="876" font-size="20">Text edit không phải save bền vững</text></g><g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"><path d="M124 172V232"/><path d="M356 172V232"/><path d="M124 340V400"/><path d="M356 340V400"/><path d="M124 544V632"/><path d="M356 544V632"/><path d="M232 472H240V286H248" stroke-dasharray="5 4"/></g></svg>
