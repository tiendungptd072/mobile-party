<svg xmlns="http://www.w3.org/2000/svg" width="480" height="920" viewBox="0 0 480 920" role="img" aria-labelledby="title desc"><title id="title">From change to presentation</title><desc id="desc">Conceptual dependencies; phases may be skipped or reused. A missed deadline can make a frame late.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs><rect width="480" height="920" rx="16" fill="#f8fafc"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#0f172a"><text x="240" y="38" font-size="23" font-weight="700">From change to presentation</text><rect x="16" y="64" width="448" height="108" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="240" y="102" font-size="22" font-weight="700">State / input change</text><text x="240" y="136" font-size="20" font-weight="400">Choose the required work</text><rect x="16" y="212" width="448" height="108" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="240" y="250" font-size="22" font-weight="700">UI description</text><text x="240" y="284" font-size="20" font-weight="400">Reuse unchanged output when possible</text><rect x="16" y="360" width="448" height="108" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="240" y="398" font-size="22" font-weight="700">Geometry / host update</text><text x="240" y="432" font-size="20" font-weight="400">Only the required changes</text><rect x="16" y="508" width="448" height="108" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="240" y="546" font-size="22" font-weight="700">Drawing / rendering</text><text x="240" y="580" font-size="20" font-weight="400">Commands, layers, prepared image</text><rect x="16" y="656" width="448" height="108" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="240" y="694" font-size="22" font-weight="700">Presentation</text><text x="240" y="728" font-size="20" font-weight="400">Prepared image reaches the display</text><rect x="16" y="806" width="448" height="84" rx="12" fill="#ffedd5" stroke="#c2410c"/><text x="240" y="838" font-size="19">A missed deadline can make a frame late</text><text x="240" y="868" font-size="19">No fixed thread or duration per box</text></g><g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"><path d="M240 172V212"/><path d="M240 320V360"/><path d="M240 468V508"/><path d="M240 616V656"/></g></svg>
